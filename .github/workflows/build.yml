name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy: 빌드용 Python 버전이 앱의 Python 버전(3.8)과 같아야 함
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Name APK by version
        run: |
          VER=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/SlideCapture Pro Android $VER.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
